name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-*.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "Flip the Cards" com.flipthecards.game --web-dir www
          npx cap add android
          mkdir assets
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick && convert icon-512.png -resize 1024x1024 assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#3b2412' || true
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          sed -i '/name="AppTheme.NoActionBar" parent/,/<\/style>/ s#</style>#    <item name="android:windowFullscreen">true</item>\n    <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n</style>#' android/app/src/main/res/values/styles.xml
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: flip-the-cards-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
